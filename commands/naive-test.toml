description = "Drive the live app as a naive first-time user and report UX/behavior gaps before deploy"
prompt = "Run the naive-user skill against the app named in {{args}}, or, if none is given, the app in naive-user.config.json. Follow the skill exactly: read naive-user.config.json, make sure the app is running, sign in via the configured auth steps, then explore the live UI as an uninformed, source-blind first-time user, producing an updated mental model and a dated findings report under qa/naive-user/<app>/. Requires the Playwright MCP server (browser_* tools). It complements scripted end-to-end tests: those assert known flows, this discovers unknown gaps."
